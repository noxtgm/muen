# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = Monospace

auth {
    fingerprint {
        enabled = true
    }
}

animations {
    animation = fadeIn, 0
    animation = fadeOut, 0
}

background {
    monitor =
    color   = rgb(000000)
}

# Time
label {
    monitor     =
    text        = $TIME
    font_size   = 90
    font_family = $font
    color       = rgb(d0d0d0)

    position = 0, 160
    halign   = center
    valign   = center
}

# Date
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %d %B %Y"
    font_size   = 20
    font_family = $font
    color       = rgb(d0d0d0)

    position = 0, 70
    halign   = center
    valign   = center
}

input-field {
    monitor           =
    size              = 20%, 5%
    rounding          = 0
    outline_thickness = 2

    outer_color = rgb(d0d0d0)
    inner_color = rgb(000000)
    font_color  = rgb(d0d0d0)

    font_family      = $font
    placeholder_text = Password
    fail_text        = $PAMFAIL$FPRINTFAIL
    fade_on_empty    = false

    position = 0, -40
    halign   = center
    valign   = center
}

# Fingerprint status
label {
    monitor     =
    text        = $FPRINTPROMPT
    font_size   = 14
    font_family = $font
    color       = rgb(808080)

    position = 0, -110
    halign   = center
    valign   = center
}
