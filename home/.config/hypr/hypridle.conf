# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

    # Never sleep before the screen is locked
    inhibit_sleep = 3

    # Apps playing video can keep the screen on
    ignore_dbus_inhibit    = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Dim the screen and turn off the keyboard backlight after 2.5 minutes
listener {
    timeout    = 150
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

listener {
    timeout    = 150
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume  = brightnessctl -rd '*::kbd_backlight'
}

# Lock after 5 minutes
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# Lock and turn the screen off after 5.5 minutes, so the screen never goes black unlocked
listener {
    timeout    = 330
    on-timeout = loginctl lock-session; hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Suspend after 10 minutes
listener {
    timeout    = 600
    on-timeout = systemctl suspend
}
